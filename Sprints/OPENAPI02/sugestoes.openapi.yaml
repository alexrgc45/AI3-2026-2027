openapi: 3.0.3

info:
  title: API de Sugestões dos Alunos
  description: >-
    API para gerir sugestões dos alunos, o seu acompanhamento e as estatísticas
    de resolução. As estatísticas são recalculadas de hora a hora; as categorias
    podem ser armazenadas em cache durante 24 horas. As transições válidas são
    submetida para em_analise, em_analise para aceite ou rejeitada, e aceite
    para resolvida; rejeitada e resolvida são estados finais. A autenticação
    é feita através de tokens JWT do tipo Bearer em todas as operações protegidas.
  version: 2.0.0
  license:
    name: Uso interno
    url: https://api.estgv.exemplo/licenca

servers:
  - url: https://api.estgv.exemplo/v2

security:
  - tokenJWT: []

paths:
  /sugestoes:
    get:
      operationId: listarSugestoes
      summary: Listar sugestões, com filtros e paginação
      description: |
        Lista sugestões com filtros e paginação.
        - **Papel admitido:** Aluno ou Serviços.
        - **Regra de propriedade:** O aluno acede apenas às suas próprias sugestões; os serviços acedem a todas.
      parameters:
        - in: query
          name: estado
          required: false
          schema:
            $ref: "#/components/schemas/Estado"
        - in: query
          name: categoria
          required: false
          schema:
            $ref: "#/components/schemas/CodigoCategoria"
        - in: query
          name: pagina
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: tamanhoPagina
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Lista de sugestões.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoCache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaSugestoes"
        "400":
          $ref: "#/components/responses/ErroBadRequest"
        "401":
          description: Requer autenticação válida (Token em falta ou inválido).
          headers:
            WWW-Authenticate:
              description: Indica o esquema de autenticação suportado e eventuais erros.
              schema:
                type: string
                enum:
                  - Bearer
                  - 'Bearer error="invalid_token"'
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              example:
                codigo: 401
                mensagem: "Token em falta ou inválido."
        default:
          $ref: "#/components/responses/ErroDefault"

    post:
      operationId: criarSugestao
      summary: Submeter uma sugestão
      description: |
        Submete uma nova sugestão.
        - **Papel admitido:** Aluno.
        - O número de aluno é obtido da identidade autenticada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SugestaoNova"
      responses:
        "201":
          description: Sugestão criada.
          headers:
            Location:
              $ref: "#/components/headers/LocationHeader"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sugestao"
        "400":
          $ref: "#/components/responses/ErroBadRequest"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/Proibido"
        default:
          $ref: "#/components/responses/ErroDefault"

  /sugestoes/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"

    get:
      operationId: obterSugestao
      summary: Obter uma sugestão
      description: |
        Obtém os detalhes de uma sugestão específica.
        - **Papel admitido:** Aluno ou Serviços.
        - **Regra de propriedade:** O aluno apenas pode aceder à sua própria sugestão; os serviços podem aceder a qualquer uma.
      parameters:
        - in: header
          name: If-None-Match
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Sugestão encontrada.
          headers:
            ETag:
              $ref: "#/components/headers/ETagHeader"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoCache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sugestao"
              example:
                id: 1
                titulo: "Melhorar o espaço de estudo"
                descricao: "Sugiro mais mesas e tomadas na sala de estudo."
                categoria: "instalacoes"
                numeroAluno: "12345"
                estado: "submetida"
                dataCriacao: "2026-10-20T10:30:00Z"
                dataAtualizacao: "2026-10-20T10:30:00Z"
                dataResolucao: null
        "304":
          description: Recurso não modificado.
          headers:
            ETag:
              $ref: "#/components/headers/ETagHeader"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoCache"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "404":
          description: Recurso não encontrado ou sugestão pertencente a outro aluno (ocultada por motivos de privacidade).
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        default:
          $ref: "#/components/responses/ErroDefault"

    put:
      operationId: substituirSugestao
      summary: Editar uma sugestão ainda submetida
      description: |
        Edita uma sugestão existente.
        - **Papel admitido:** Aluno.
        - **Regra de propriedade:** O aluno apenas pode editar as suas próprias sugestões e apenas no estado submetida.
      parameters:
        - in: header
          name: If-Match
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SugestaoNova"
      responses:
        "200":
          description: Sugestão atualizada.
          headers:
            ETag:
              $ref: "#/components/headers/ETagHeader"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sugestao"
        "400":
          $ref: "#/components/responses/ErroBadRequest"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/Proibido"
        "404":
          description: Recurso não encontrado ou sugestão pertencente a outro aluno (ocultada por motivos de privacidade).
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "409":
          description: >-
            Conflito de negócio: a sugestão só pode ser editada quando está
            no estado submetida.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "412":
          $ref: "#/components/responses/ErroPreconditionFailed"
        default:
          $ref: "#/components/responses/ErroDefault"

    delete:
      operationId: retirarSugestao
      summary: Retirar uma sugestão ainda submetida
      description: |
        Retira ou elimina uma sugestão submetida.
        - **Papel admitido:** Aluno.
        - **Regra de propriedade:** O aluno apenas pode retirar as suas próprias sugestões e apenas no estado submetida.
      responses:
        "204":
          description: Sugestão retirada com sucesso.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/Proibido"
        "404":
          description: Recurso não encontrado ou sugestão pertencente a outro aluno (ocultada por motivos de privacidade).
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "409":
          description: >-
            Conflito de negócio: uma sugestão só pode ser retirada quando
            está no estado submetida.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        default:
          $ref: "#/components/responses/ErroDefault"

  /sugestoes/{id}/acompanhamentos:
    parameters:
      - $ref: "#/components/parameters/Id"

    get:
      operationId: listarAcompanhamentos
      summary: Histórico de acompanhamento, do mais antigo para o mais recente
      description: |
        Lista o histórico de acompanhamento de uma sugestão.
        - **Papel admitido:** Aluno ou Serviços.
        - **Regra de propriedade:** O aluno apenas pode consultar o histórico das suas próprias sugestões; os serviços podem consultar qualquer uma.
      responses:
        "200":
          description: Histórico dos acompanhamentos da sugestão.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateNoCache"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Acompanhamento"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "404":
          description: Recurso não encontrado ou sugestão pertencente a outro aluno (ocultada por motivos de privacidade).
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        default:
          $ref: "#/components/responses/ErroDefault"

    post:
      operationId: registarAcompanhamento
      summary: Registar uma mudança de estado
      description: |
        Regista uma mudança de estado e respetivo acompanhamento.
        - **Papel admitido:** Serviços.
        - O responsável é obtido da identidade autenticada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcompanhamentoNovo"
      responses:
        "201":
          description: Acompanhamento registado.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Acompanhamento"
        "400":
          $ref: "#/components/responses/ErroBadRequest"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/Proibido"
        "404":
          description: Recurso não encontrado.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "409":
          description: >-
            Conflito de negócio: a transição tem de ser válida. São permitidas
            submetida para em_analise; em_analise para aceite ou rejeitada;
            e aceite para resolvida. Os estados rejeitada e resolvida são finais.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        default:
          $ref: "#/components/responses/ErroDefault"

  /estatisticas/resolucao:
    get:
      operationId: obterEstatisticasResolucao
      summary: Totais por estado, taxa e tempo médio de resolução
      security: []
      parameters:
        - in: query
          name: anoLetivo
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{4}$'
      responses:
        "200":
          description: Estatísticas de resolução.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPublicMaxAge3600"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstatisticasResolucao"
        "400":
          $ref: "#/components/responses/ErroBadRequest"
        default:
          $ref: "#/components/responses/ErroDefault"

  /estatisticas/categorias:
    get:
      operationId: obterEstatisticasCategorias
      summary: Os mesmos indicadores, por categoria
      security: []
      parameters:
        - in: query
          name: anoLetivo
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{4}$'
      responses:
        "200":
          description: Estatísticas por categoria.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPublicMaxAge3600"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstatisticasCategorias"
        "400":
          $ref: "#/components/responses/ErroBadRequest"
        default:
          $ref: "#/components/responses/ErroDefault"

  /categorias:
    get:
      operationId: listarCategorias
      summary: Listar as categorias e a sua descrição
      security: []
      responses:
        "200":
          description: Lista das categorias disponíveis.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPublicMaxAge86400"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Categoria"
        default:
          $ref: "#/components/responses/ErroDefault"

  /tokens:
    post:
      operationId: criarToken
      summary: Criar ou obter token de autenticação
      description: Operação pública para autenticar credenciais e gerar um token JWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credenciais"
      responses:
        "200":
          description: Token gerado com sucesso.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
              example:
                token: "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMjM0NTYifQ.signature"
                tipo: "Bearer"
                expiraEm: 900
        "400":
          $ref: "#/components/responses/ErroBadRequest"
        "401":
          $ref: "#/components/responses/CredenciaisInvalidas"
        default:
          $ref: "#/components/responses/ErroDefault"

components:
  securitySchemes:
    tokenJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Autenticação baseada em JSON Web Token (JWT) do tipo Bearer.

        Claims documentados no payload:
        - `sub` (string): identificador do utilizador, número de aluno ou ID de funcionário.
        - `nome` (string): nome do utilizador.
        - `papel` (string): papel do utilizador, `aluno` ou `servicos`.
        - `iat` (integer): timestamp Unix de emissão do token (Issued At).
        - `exp` (integer): timestamp Unix de expiração do token (Expiration Time).

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identificador positivo da sugestão.
      schema:
        type: integer
        minimum: 1

  headers:
    CacheControlPublicMaxAge86400:
      description: Política de cache pública com validade de 24 horas.
      schema:
        type: string
        enum:
          - public, max-age=86400

    CacheControlPublicMaxAge3600:
      description: Política de cache pública com validade de uma hora.
      schema:
        type: string
        enum:
          - public, max-age=3600

    CacheControlPrivateNoCache:
      description: Política de cache privada que exige revalidação antes da reutilização.
      schema:
        type: string
        enum:
          - private, no-cache

    CacheControlNoStore:
      description: Política de cache que proíbe o armazenamento da resposta.
      schema:
        type: string
        enum:
          - no-store

    ETagHeader:
      description: Valor de ETag da representação atual do recurso.
      schema:
        type: string

    LocationHeader:
      description: Localização do recurso recém-criado.
      schema:
        type: string

  responses:
    ErroBadRequest:
      description: Requisição inválida.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
    ErroPreconditionFailed:
      description: A condição de pré-condição indicada não foi satisfeita.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
    ErroDefault:
      description: Erro inesperado ou não tratado.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
    NaoAutenticado:
      description: Requer autenticação válida (Token em falta ou inválido).
      headers:
        WWW-Authenticate:
          description: Indica o esquema de autenticação suportado e eventuais erros.
          schema:
            type: string
            enum:
              - Bearer
              - 'Bearer error="invalid_token"'
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
    CredenciaisInvalidas:
      description: Credenciais de acesso incorretas.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
    Proibido:
      description: Acesso negado por falta de permissões ou papel insuficiente.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"

  schemas:
    Estado:
      type: string
      enum:
        - submetida
        - em_analise
        - aceite
        - rejeitada
        - resolvida
      description: Estado atual da sugestão.

    CodigoCategoria:
      type: string
      enum:
        - instalacoes
        - ensino
        - servicos
        - atividades
        - outra
      description: Código único da categoria.

    Categoria:
      type: object
      required:
        - codigo
        - descricao
      properties:
        codigo:
          $ref: "#/components/schemas/CodigoCategoria"
        descricao:
          type: string
          minLength: 3
          maxLength: 80
      additionalProperties: false

    # Dados enviados pelo cliente ao criar ou editar uma sugestão.
    # A identidade do aluno não é fornecida neste schema.
    SugestaoNova:
      type: object
      required:
        - titulo
        - descricao
        - categoria
      properties:
        titulo:
          type: string
          minLength: 10
          maxLength: 120
        descricao:
          type: string
          minLength: 20
          maxLength: 2000
        categoria:
          $ref: "#/components/schemas/CodigoCategoria"

    # Representação completa da sugestão devolvida pelo servidor.
    Sugestao:
      allOf:
        - $ref: "#/components/schemas/SugestaoNova"
        - type: object
          required:
            - id
            - estado
            - dataCriacao
            - dataAtualizacao
            - dataResolucao
            - numeroAluno
          properties:
            id:
              type: integer
              minimum: 1
              readOnly: true
            numeroAluno:
              type: string
              pattern: '^\d{5,8}$'
              readOnly: true
              description: Número do aluno obtido da identidade autenticada.
            estado:
              $ref: "#/components/schemas/Estado"
            dataCriacao:
              type: string
              format: date-time
              readOnly: true
            dataAtualizacao:
              type: string
              format: date-time
              readOnly: true
            dataResolucao:
              type: string
              format: date-time
              nullable: true
              readOnly: true

    # Dados enviados pelo cliente para registar um acompanhamento.
    # O responsável é determinado pelo servidor.
    AcompanhamentoNovo:
      type: object
      required:
        - novoEstado
        - nota
      properties:
        novoEstado:
          $ref: "#/components/schemas/Estado"
        nota:
          type: string
          minLength: 5
          maxLength: 500

    # Representação completa do acompanhamento devolvida pelo servidor.
    Acompanhamento:
      allOf:
        - $ref: "#/components/schemas/AcompanhamentoNovo"
        - type: object
          required:
            - id
            - estadoAnterior
            - data
            - responsavel
          properties:
            id:
              type: integer
              minimum: 1
              readOnly: true
            responsavel:
              type: string
              minLength: 5
              maxLength: 60
              pattern: "^[A-ZÀ-Ý][a-zà-ÿ]+ [A-ZÀ-Ý][a-zà-ÿ]+$"
              readOnly: true
              description: Nome do funcionário autenticado que registou o acompanhamento.
            estadoAnterior:
              allOf:
                - $ref: "#/components/schemas/Estado"
              readOnly: true
            data:
              type: string
              format: date-time
              readOnly: true

    # Credenciais necessárias para obter um token.
    Credenciais:
      type: object
      required:
        - utilizador
        - palavraPasse
      properties:
        utilizador:
          type: string
          pattern: '^(\d{5,8}|[a-z]+\.[a-z]+)$'
          description: Número de aluno ou identificador no formato nome.apelido.
        palavraPasse:
          type: string
          minLength: 8
          maxLength: 128
          format: password
      additionalProperties: false

    # Resposta do endpoint de autenticação.
    Token:
      type: object
      required:
        - token
        - tipo
        - expiraEm
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
          description: JWT compacto com três segmentos separados por pontos.
        tipo:
          type: string
          enum:
            - Bearer
        expiraEm:
          type: integer
          minimum: 1
          description: Tempo de validade do token em segundos.
      additionalProperties: false

    ListaSugestoes:
      type: object
      required:
        - pagina
        - tamanhoPagina
        - total
        - itens
      properties:
        pagina:
          type: integer
          minimum: 1
        tamanhoPagina:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        itens:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/Sugestao"
      additionalProperties: false

    EstatisticasResolucao:
      type: object
      required:
        - anoLetivo
        - totalSugestoes
        - porEstado
        - taxaResolucao
        - tempoMedioResolucaoDias
      properties:
        anoLetivo:
          type: string
          pattern: '^\d{4}-\d{4}$'
        totalSugestoes:
          type: integer
          minimum: 0
        porEstado:
          type: object
          required:
            - submetida
            - em_analise
            - aceite
            - rejeitada
            - resolvida
          properties:
            submetida:
              type: integer
              minimum: 0
            em_analise:
              type: integer
              minimum: 0
            aceite:
              type: integer
              minimum: 0
            rejeitada:
              type: integer
              minimum: 0
            resolvida:
              type: integer
              minimum: 0
          additionalProperties: false
        taxaResolucao:
          type: number
          minimum: 0
          maximum: 1
        tempoMedioResolucaoDias:
          type: number
          minimum: 0
          nullable: true
      additionalProperties: false

    EstatisticasCategorias:
      type: object
      required:
        - anoLetivo
        - categorias
      properties:
        anoLetivo:
          type: string
          pattern: '^\d{4}-\d{4}$'
        categorias:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            required:
              - categoria
              - total
              - resolvidas
              - taxaResolucao
            properties:
              categoria:
                $ref: "#/components/schemas/CodigoCategoria"
              total:
                type: integer
                minimum: 0
              resolvidas:
                type: integer
                minimum: 0
              taxaResolucao:
                type: number
                minimum: 0
                maximum: 1
            additionalProperties: false
      additionalProperties: false

    Erro:
      type: object
      required:
        - codigo
        - mensagem
      properties:
        codigo:
          type: integer
          minimum: 400
          maximum: 599
        mensagem:
          type: string
          minLength: 1
          maxLength: 200
        detalhes:
          type: array
          items:
            type: object
            required:
              - campo
              - problema
            properties:
              campo:
                type: string
              problema:
                type: string
            additionalProperties: false
      additionalProperties: false