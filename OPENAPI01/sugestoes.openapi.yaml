openapi: 3.0.3
info:
  title: API de Sugestões dos Alunos
  description: >-
    API para gerir sugestões dos alunos, o seu acompanhamento e as estatísticas de resolução.
    As estatísticas são recalculadas de hora a hora; as categorias podem ser armazenadas em cache
    durante 24 horas. As transições válidas são submetida para em_analise, em_analise para
    aceite ou rejeitada, e aceite para resolvida; rejeitada e resolvida são estados finais.
  version: 1.0.0

servers:
  - url: https://api.estgv.exemplo/v1

paths:
  /sugestoes:
    get:
      operationId: listarSugestoes
      summary: Listar sugestões, com filtros e paginação
      parameters:
        - in: query
          name: estado
          required: false
          schema:
            $ref: '#/components/schemas/Estado'
        - in: query
          name: categoria
          required: false
          schema:
            $ref: '#/components/schemas/CodigoCategoria'
        - in: query
          name: pagina
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: tamanhoPagina
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Lista de sugestões.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlPrivateNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaSugestoes'
        '400':
          $ref: '#/components/responses/ErroBadRequest'
        default:
          $ref: '#/components/responses/ErroDefault'
    post:
      operationId: criarSugestao
      summary: Submeter uma sugestão
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SugestaoNova'
      responses:
        '201':
          description: Sugestão criada.
          headers:
            Location:
              $ref: '#/components/headers/LocationHeader'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sugestao'
        '400':
          $ref: '#/components/responses/ErroBadRequest'
        default:
          $ref: '#/components/responses/ErroDefault'

  /sugestoes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: obterSugestao
      summary: Obter uma sugestão
      parameters:
        - in: header
          name: If-None-Match
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Sugestão encontrada.
          headers:
            ETag:
              $ref: '#/components/headers/ETagHeader'
            Cache-Control:
              $ref: '#/components/headers/CacheControlPrivateNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sugestao'
              example:
                id: 42
                titulo: "Reparo das salas de estudo"
                descricao: "As salas de estudo não têm iluminação adequada e precisam de manutenção urgente."
                categoria: instalacoes
                numeroAluno: "20234"
                estado: aceite
                dataCriacao: '2026-10-01T09:30:00Z'
                dataAtualizacao: '2026-10-02T10:00:00Z'
                dataResolucao: null
        '304':
          description: Recurso não modificado.
          headers:
            ETag:
              $ref: '#/components/headers/ETagHeader'
            Cache-Control:
              $ref: '#/components/headers/CacheControlPrivateNoCache'
        '404':
          $ref: '#/components/responses/ErroNotFound'
        default:
          $ref: '#/components/responses/ErroDefault'
    put:
      operationId: substituirSugestao
      summary: Editar uma sugestão ainda submetida
      parameters:
        - in: header
          name: If-Match
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SugestaoNova'
      responses:
        '200':
          description: Sugestão atualizada.
          headers:
            ETag:
              $ref: '#/components/headers/ETagHeader'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sugestao'
        '400':
          $ref: '#/components/responses/ErroBadRequest'
        '404':
          $ref: '#/components/responses/ErroNotFound'
        '409':
          description: "Conflito de negócio: a sugestão só pode ser editada quando está no estado submetida."
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '412':
          $ref: '#/components/responses/ErroPreconditionFailed'
        default:
          $ref: '#/components/responses/ErroDefault'
    delete:
      operationId: retirarSugestao
      summary: Retirar uma sugestão ainda submetida
      responses:
        '204':
          description: Sugestão retirada com sucesso.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '404':
          $ref: '#/components/responses/ErroNotFound'
        '409':
          description: "Conflito de negócio: uma sugestão só pode ser retirada quando está no estado submetida."
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        default:
          $ref: '#/components/responses/ErroDefault'

  /sugestoes/{id}/acompanhamentos:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: listarAcompanhamentos
      summary: Histórico de acompanhamento, do mais antigo para o mais recente
      responses:
        '200':
          description: Histórico dos acompanhamentos da sugestão.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlPrivateNoCache'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Acompanhamento'
        '404':
          $ref: '#/components/responses/ErroNotFound'
        default:
          $ref: '#/components/responses/ErroDefault'
    post:
      operationId: registarAcompanhamento
      summary: Registar uma mudança de estado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcompanhamentoNovo'
      responses:
        '201':
          description: Acompanhamento registado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acompanhamento'
        '400':
          $ref: '#/components/responses/ErroBadRequest'
        '404':
          $ref: '#/components/responses/ErroNotFound'
        '409':
          description: >-
            Conflito de negócio: a transição tem de ser válida. São permitidas
            submetida para em_analise; em_analise para aceite ou rejeitada;
            e aceite para resolvida. Os estados rejeitada e resolvida são finais.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        default:
          $ref: '#/components/responses/ErroDefault'

  /estatisticas/resolucao:
    get:
      operationId: obterEstatisticasResolucao
      summary: Totais por estado, taxa e tempo médio de resolução
      parameters:
        - in: query
          name: anoLetivo
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{4}$'
      responses:
        '200':
          description: Estatísticas de resolução.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublicMaxAge3600'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstatisticasResolucao'
              example:
                anoLetivo: "2026-2027"
                totalSugestoes: 48
                porEstado:
                  submetida: 5
                  em_analise: 7
                  aceite: 12
                  rejeitada: 9
                  resolvida: 15
                taxaResolucao: 0.3125
                tempoMedioResolucaoDias: 14.5
        '400':
          $ref: '#/components/responses/ErroBadRequest'
        default:
          $ref: '#/components/responses/ErroDefault'

  /estatisticas/categorias:
    get:
      operationId: obterEstatisticasCategorias
      summary: Os mesmos indicadores, por categoria
      parameters:
        - in: query
          name: anoLetivo
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{4}$'
      responses:
        '200':
          description: Estatísticas por categoria.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublicMaxAge3600'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstatisticasCategorias'
        '400':
          $ref: '#/components/responses/ErroBadRequest'
        default:
          $ref: '#/components/responses/ErroDefault'

  /categorias:
    get:
      operationId: listarCategorias
      summary: Listar as categorias e a sua descrição
      responses:
        '200':
          description: Lista das categorias disponíveis.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublicMaxAge86400'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'
        default:
          $ref: '#/components/responses/ErroDefault'

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identificador positivo da sugestão.
      schema:
        type: integer
        minimum: 1

  headers:
    CacheControlPublicMaxAge86400:
      description: Política de cache pública com validade de 24 horas.
      schema:
        type: string
        enum:
          - public, max-age=86400
    CacheControlPublicMaxAge3600:
      description: Política de cache pública com validade de uma hora.
      schema:
        type: string
        enum:
          - public, max-age=3600
    CacheControlPrivateNoCache:
      description: Política de cache privada sem cache por defeito.
      schema:
        type: string
        enum:
          - private, no-cache
    CacheControlNoStore:
      description: Política de cache sem armazenamento.
      schema:
        type: string
        enum:
          - no-store
    ETagHeader:
      description: Valor de etag da representação atual do recurso.
      schema:
        type: string
    LocationHeader:
      description: Localização do recurso recém-criado.
      schema:
        type: string

  responses:
    ErroBadRequest:
      description: Requisição inválida.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    ErroNotFound:
      description: Recurso não encontrado.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    ErroPreconditionFailed:
      description: A condição de pré-condição indicada não foi satisfeita.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    ErroDefault:
      description: Erro inesperado ou não tratado.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

  schemas:
    Estado:
      type: string
      enum:
        - submetida
        - em_analise
        - aceite
        - rejeitada
        - resolvida
      description: Estado atual da sugestão.

    CodigoCategoria:
      type: string
      enum:
        - instalacoes
        - ensino
        - servicos
        - atividades
        - outra
      description: Código único da categoria.

    Categoria:
      type: object
      required:
        - codigo
        - descricao
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoCategoria'
        descricao:
          type: string
          minLength: 3
          maxLength: 80
      additionalProperties: false

    SugestaoNova:
      type: object
      required:
        - titulo
        - descricao
        - categoria
        - numeroAluno
      properties:
        titulo:
          type: string
          minLength: 10
          maxLength: 120
        descricao:
          type: string
          minLength: 20
          maxLength: 2000
        categoria:
          $ref: '#/components/schemas/CodigoCategoria'
        numeroAluno:
          type: string
          pattern: '^\d{5,8}$'

    Sugestao:
      allOf:
        - $ref: '#/components/schemas/SugestaoNova'
        - type: object
          required:
            - id
            - estado
            - dataCriacao
            - dataAtualizacao
            - dataResolucao
          properties:
            id:
              type: integer
              minimum: 1
              readOnly: true
            estado:
              $ref: '#/components/schemas/Estado'
              readOnly: true
            dataCriacao:
              type: string
              format: date-time
              readOnly: true
            dataAtualizacao:
              type: string
              format: date-time
              readOnly: true
            dataResolucao:
              type: string
              format: date-time
              nullable: true
              readOnly: true

    AcompanhamentoNovo:
      type: object
      required:
        - novoEstado
        - nota
        - responsavel
      properties:
        novoEstado:
          $ref: '#/components/schemas/Estado'
        nota:
          type: string
          minLength: 5
          maxLength: 500
        responsavel:
          type: string
          minLength: 5
          maxLength: 60
          pattern: '^[A-Z][a-z]+ [A-Z][a-z]+$'

    Acompanhamento:
      allOf:
        - $ref: '#/components/schemas/AcompanhamentoNovo'
        - type: object
          required:
            - id
            - estadoAnterior
            - data
          properties:
            id:
              type: integer
              minimum: 1
              readOnly: true
            estadoAnterior:
              $ref: '#/components/schemas/Estado'
              readOnly: true
            data:
              type: string
              format: date-time
              readOnly: true

    ListaSugestoes:
      type: object
      required:
        - pagina
        - tamanhoPagina
        - total
        - itens
      properties:
        pagina:
          type: integer
          minimum: 1
        tamanhoPagina:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        itens:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Sugestao'
      additionalProperties: false

    EstatisticasResolucao:
      type: object
      required:
        - anoLetivo
        - totalSugestoes
        - porEstado
        - taxaResolucao
        - tempoMedioResolucaoDias
      properties:
        anoLetivo:
          type: string
          pattern: '^\d{4}-\d{4}$'
        totalSugestoes:
          type: integer
          minimum: 0
        porEstado:
          type: object
          required:
            - submetida
            - em_analise
            - aceite
            - rejeitada
            - resolvida
          properties:
            submetida:
              type: integer
              minimum: 0
            em_analise:
              type: integer
              minimum: 0
            aceite:
              type: integer
              minimum: 0
            rejeitada:
              type: integer
              minimum: 0
            resolvida:
              type: integer
              minimum: 0
          additionalProperties: false
        taxaResolucao:
          type: number
          minimum: 0
          maximum: 1
        tempoMedioResolucaoDias:
          type: number
          minimum: 0
          nullable: true
      additionalProperties: false

    EstatisticasCategorias:
      type: object
      required:
        - anoLetivo
        - categorias
      properties:
        anoLetivo:
          type: string
          pattern: '^\d{4}-\d{4}$'
        categorias:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            required:
              - categoria
              - total
              - resolvidas
              - taxaResolucao
            properties:
              categoria:
                $ref: '#/components/schemas/CodigoCategoria'
              total:
                type: integer
                minimum: 0
              resolvidas:
                type: integer
                minimum: 0
              taxaResolucao:
                type: number
                minimum: 0
                maximum: 1
            additionalProperties: false
      additionalProperties: false

    Erro:
      type: object
      required:
        - codigo
        - mensagem
      properties:
        codigo:
          type: integer
          minimum: 400
          maximum: 599
        mensagem:
          type: string
          minLength: 1
          maxLength: 200
        detalhes:
          type: array
          items:
            type: object
            required:
              - campo
              - problema
            properties:
              campo:
                type: string
              problema:
                type: string
            additionalProperties: false
      additionalProperties: false
