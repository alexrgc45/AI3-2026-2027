<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de consulta de sugestões académicas">
    <title>Sistema de Sugestões</title>
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/app.js"></script>
</head>

<body>
    <header class="cabecalho">
        <div class="container">
            <h1>Sistema de Sugestões</h1>
            <p>Consulta e acompanha as sugestões académicas.</p>
        </div>
    </header>

    <main class="container principal">
        <!-- Zona de Configurações (Sempre visível) -->
        <section class="painel">
            <h3>Configurações</h3>
            
            <div class="campo">
                <label for="select-tema">Tema</label>
                <select id="select-tema">
                    <option value="claro">Claro</option>
                    <option value="escuro">Escuro</option>
                </select>
            </div>

            <div class="campo">
                <label for="select-ordenacao">Ordenação</label>
                <select id="select-ordenacao">
                    <option value="recentes">Recentes</option>
                    <option value="estado">Estado</option>
                </select>
            </div>
        </section>
        
        <section id="zona-login" class="painel" aria-labelledby="titulo-login">
            <h2 id="titulo-login">Iniciar sessão</h2>
            <p>Introduz as tuas credenciais para continuar.</p>

            <form id="form-login">
                <div class="campo">
                    <label for="utilizador">Utilizador</label>
                    <input id="utilizador" name="utilizador" type="text" autocomplete="username" required>
                </div>

                <div class="campo">
                    <label for="palavra-passe">Palavra-passe</label>
                    <input id="palavra-passe" name="palavraPasse" type="password" autocomplete="current-password"
                        required>
                </div>

                <button id="botao-login" type="submit">Iniciar sessão</button>
                <p id="erro-login" class="mensagem erro" role="alert" hidden></p>
            </form>
        </section>

        <section id="zona-sessao" class="painel" aria-labelledby="titulo-sessao" hidden>
            <div class="cabecalho-sessao">
                <div>
                    <h2 id="titulo-sessao">Bem-vindo/a, <span id="nome-utilizador"></span></h2>
                    <p>Perfil: <strong id="papel-utilizador"></strong></p>
                </div>
                <button id="botao-logout" class="botao-secundario" type="button">
                    Terminar sessão
                </button>
            </div>

            <p id="tempo-sessao" class="tempo-sessao" aria-live="polite"></p>

            <div class="titulo-lista">
                <h3>Lista de sugestões</h3>
                <button id="botao-atualizar" class="botao-secundario" type="button">
                    Atualizar
                </button>
            </div>

            <p id="mensagem-sugestoes" role="status" hidden></p>
            <div id="lista-sugestoes" class="lista-sugestoes"></div>

            <!-- Formulário de Nova Sugestão (Apenas para alunos) -->
            <div id="zona-nova-sugestao" class="painel" style="margin-top: 24px;" hidden>
                <h3>Criar Nova Sugestão</h3>
                <form id="form-sugestao">
                    <div class="campo">
                        <label for="titulo-sugestao">Título</label>
                        <input type="text" id="titulo-sugestao" required>
                    </div>
                    <div class="campo">
                        <label for="categoria-sugestao">Categoria</label>
                        <input type="text" id="categoria-sugestao" required>
                    </div>
                    <div class="campo">
                        <label for="descricao-sugestao">Descrição</label>
                        <textarea id="descricao-sugestao" rows="3" required></textarea>
                    </div>
                    <button type="submit">Submeter Sugestão</button>
                    <p id="erro-sugestao" class="mensagem erro" role="alert" hidden></p>
                </form>
            </div>
        </section>

    </main>

    <footer class="rodape">
        <div class="container">
            <p>Sistema de Sugestões Académicas</p>
        </div>
    </footer>
</body>

</html>
