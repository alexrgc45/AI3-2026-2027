<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugestões dos Alunos</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
</head>

<body>
    <header class="cabecalho">
        <h1>Sugestões dos Alunos</h1>
    </header>

    <main>
        <div id="mensagem" class="mensagem" role="alert" hidden></div>

        <!-- Área de entrada -->
        <section id="entrada" aria-labelledby="titulo-entrada">
            <h2 id="titulo-entrada">Entrar</h2>
            <form id="form-entrada" novalidate>
                <div class="campo">
                    <label for="utilizador">Utilizador</label>
                    <input id="utilizador" name="utilizador" type="text" autocomplete="username" required>
                </div>
                <div class="campo">
                    <label for="palavraPasse">Palavra-passe</label>
                    <input id="palavraPasse" name="palavraPasse" type="password" autocomplete="current-password"
                        required>
                </div>
                <button id="botao-entrar" type="submit">Entrar</button>
            </form>
        </section>

        <!-- Área de sessão -->
        <section id="sessao" aria-labelledby="titulo-sessao" hidden>
            <h2 id="titulo-sessao" tabindex="-1">Sessão</h2>
            <dl class="dados-sessao">
                <dt>Nome</dt>
                <dd id="sessao-nome"></dd>
                <dt>Papel</dt>
                <dd id="sessao-papel"></dd>
                <dt>Expira às</dt>
                <dd id="sessao-expira"></dd>
                <dt>Tempo restante</dt>
                <dd id="sessao-restante" aria-live="off"></dd>
            </dl>

            <div class="acoes">
                <button id="botao-sugestoes" type="button">As minhas sugestões</button>
                <button id="botao-sair" type="button" class="secundario">Terminar sessão</button>
            </div>

            <ul id="lista-sugestoes" class="lista"></ul>
        </section>
    </main>
</body>

</html>
